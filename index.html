<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="icon" type="image/png" href="img/1.JPG">
  <title>unclick+</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0049F7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Tahoma";
      font-style: normal;
      color: #FFA6E7;
      cursor: pointer;
      padding: 20px;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 18px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    h1 {
      font-size: 1.4rem;
      line-height: 1.4;
      margin: 0;
      white-space: pre-line;
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    .fade-out {
      opacity: 0 !important;
    }
    p {
      margin-top: 10px;
      opacity: 0.6;
      font-size: 0.8rem;
    }
    #muteBtn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.1rem;
      color: #FFA6E7;
      cursor: pointer;
      z-index: 10;
    }
    .container {
      position: relative;
      z-index: 2;
    }
    .floaty {
      position: fixed;
      top: -10%;
      width: 32px;
      height: 32px;
      opacity: 0;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 1;
    }
    .floaty img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0;
      margin: 0;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) translateX(20px) rotate(20deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body onclick="changeVibe()">
  <div id="floatyLayer"></div>
  <div class="container">
  <img id="vibeImage" src="img/1.jpeg" alt="vibe image" />
  <h1 id="phrase">Hasta dónde te quiero, Panie <3 </h1>
</div>
<audio id="bgMusic" src="audio/song.mp3" loop></audio>
<button id="muteBtn" onclick="toggleMute(event)">🔊</button>
<script>
  const phrases = [
    "Mi dulce Panie, pedacito de cielo en la tierra, mi vida es tuya, y todo aquello que aún no ha sido también te guarda",
    "Mi Panie amada",
    "Feliz día de la mejoooooor novia",
    "´Amarte es como contemplar el horizonte: sé que nunca podré abarcarlo por completo, y aun así, no hay nada en el mundo\nque desee mirar más´",
    "Mientras haya en mí esta certeza de que eres, de que estás incluso cuando no te veo,\ny que basta pensarte para que algo se encienda, voy a seguir en esto,en este amor que no pide respuesta\nni se agota en el tiempo, en este quedarse aunque todo lo demás pase.",
    "¡Muchachita mía!,\nsi esto no es todo, se parece demasiado.",
    "No inventaré la inútil mentira de la perpetuidad,\nmejor cruzar los puentes con las manos llenas de ti, tirando a pedacitos mi recuerdo, dándolo a las palomas, a los fieles gorriones, que te coman entre cantos y bullas y aleteos"
  ];
  const images = [
    "img/1.JPG",
    "img/2.jpeg",
    "img/3.jpeg",
    "img/4.jpeg",
    "img/5.jpeg",
    "img/6.jpg",
    "img/7.JPG",
    "img/8.jpeg"
  ];
  const phraseEl = document.getElementById("phrase");
  const imageEl = document.getElementById("vibeImage");
  const musicEl = document.getElementById("bgMusic");
  const floatyLayer = document.getElementById("floatyLayer");
  const symbols = [
    "img/stickers/star1.png",
    "img/stickers/star2.png",
    "img/stickers/star3.png",
    "img/stickers/star4.png",
    "img/stickers/star5.png",
    "img/stickers/heart1.png",
    "img/stickers/heart2.png",
    "img/stickers/heart3.png",
    "img/stickers/heart4.png",
    "img/stickers/heart5.png"
  ];
  let musicStarted = false;
  // ESTADO INICIAL ESTÁ MOSTRANDO EL TEXTO
  let showing = "text";
  imageEl.style.display = "none";

  function spawnFloaty() {
    const el = document.createElement("span");
    el.className = "floaty";
    const img = document.createElement("img");
    img.src = symbols[Math.floor(Math.random() * symbols.length)];
    el.appendChild(img);
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "100vh";
    const duration = 8 + Math.random() * 6;
    el.style.animationDuration = duration + "s";
    const size = 22 + Math.random() * 26;
    el.style.width = size + "px";
    el.style.height = size + "px";
    floatyLayer.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }
  setInterval(spawnFloaty, 700);
  for (let i = 0; i < 6; i++) setTimeout(spawnFloaty, i * 300);

  function changeVibe() {
    if (!musicStarted) {
      musicEl.volume = 0.5;
      musicEl.play().catch(() => {});
      musicStarted = true;
    }
    const currentEl = showing === "text" ? phraseEl : imageEl;
    currentEl.classList.add("fade-out");
    setTimeout(() => {
      if (showing === "text") {
        // ocultar el texto
        phraseEl.style.display = "none";
        phraseEl.classList.remove("fade-out");
        // mostrar imagen
        imageEl.src = images[Math.floor(Math.random() * images.length)];
        imageEl.classList.add("fade-out");
        imageEl.style.display = "block";
        requestAnimationFrame(() => imageEl.classList.remove("fade-out"));
        showing = "image";
      } else {
        // ocultar imagen
        imageEl.style.display = "none";
        imageEl.classList.remove("fade-out");
        // mostrar texto
        phraseEl.textContent =
          phrases[Math.floor(Math.random() * phrases.length)];
        phraseEl.classList.add("fade-out");
        phraseEl.style.display = "block";
        requestAnimationFrame(() => phraseEl.classList.remove("fade-out"));
        showing = "text";
      }
    }, 250);
  }
  function toggleMute(e) {
    e.stopPropagation();
    musicEl.muted = !musicEl.muted;
    document.getElementById("muteBtn").textContent = musicEl.muted ? "🔇" : "🔊";
  }
</script>
</body>
</html>
